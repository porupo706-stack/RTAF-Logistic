      function _rptRow(icon, bg, name, desc, type) {
        return '<div id="rptRow-' + type + '" onclick="_selectRpt(\'' + type + '\')" ' +
          'style="display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #f8f8f8;cursor:pointer;transition:0.15s;border-left:3px solid transparent;">' +
          '<div style="width:44px;height:44px;border-radius:12px;background:' + bg + ';display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">' + icon + '</div>' +
          '<div style="flex:1;"><div style="font-size:14px;font-weight:600;color:#202124;">' + name + '</div><div style="font-size:12px;color:#70757a;margin-top:2px;">' + desc + '</div></div>' +
          '<div style="color:#ccc;font-size:18px;">›</div></div>';
      }

      var _rptType = ''; var _rptSheet = 'all'; var _rptFmt = 'normal';
      var _qrAllItems = []; var _qrSelected = {};
      // [CHANGE] วาง Web app URL (ลงท้าย /exec) ที่ได้จากการ Deploy ของคุณแทน YOUR_DEPLOYMENT_ID (ต้องเหมือนใน Code.gs)
      var QR_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec"; 

      function _selectSheet(sheet) {
        _rptSheet = sheet;
        ['all','สายพลา','สายสื่อสาร','สายช่างโยธา','สายขนส่ง'].forEach(function(s) {  // [CHANGE-ถ้าสายต่างจากต้นแบบ] รายชื่อสาย ต้องตรงกับปุ่มเลือกสายด้านบน
          var btn = document.getElementById('sheetBtn-' + s);
          if (!btn) return;
          btn.style.background  = s === sheet ? '#1a73e8' : 'white';
          btn.style.color       = s === sheet ? 'white'   : '#5f6368';
          btn.style.borderColor = s === sheet ? '#1a73e8' : '#e0e0e0';
        });
        if (_rptType === 'qrlabel') {
          var qrSearch = document.getElementById('qrSearchInput');
          if (qrSearch) qrSearch.value = '';
          renderQrItemList(getFilteredQrItems(''));
        }
      }

      function _selectRpt(type) {
        _rptType = type; _rptSheet = 'all'; _rptFmt = 'normal';
        ['stock','low','histfull','daily','qrlabel'].forEach(function(t) {
          var el = document.getElementById('rptRow-' + t);
          if (!el) return;
          el.style.background = t === type ? '#e8f0fe' : 'transparent';
          el.style.borderLeft = t === type ? '3px solid #1a73e8' : '3px solid transparent';
        });
        ['all','สายพลา','สายสื่อสาร','สายช่างโยธา','สายขนส่ง'].forEach(function(s) {  // [CHANGE-ถ้าสายต่างจากต้นแบบ] รายชื่อสาย ต้องตรงกับปุ่มเลือกสายด้านบน
          var btn = document.getElementById('sheetBtn-' + s);
          if (!btn) return;
          btn.style.background  = s === 'all' ? '#1a73e8' : 'white';
          btn.style.color       = s === 'all' ? 'white'   : '#5f6368';
          btn.style.borderColor = s === 'all' ? '#1a73e8' : '#e0e0e0';
        });
        var sw = document.getElementById('rptSheetWrap');
        var dw = document.getElementById('rptDateWrap');
        var qw = document.getElementById('rptQrWrap');
        var bw = document.getElementById('rptBtnWrap');
        if (sw) sw.style.display = (type === 'stock' || type === 'low' || type === 'qrlabel') ? 'block' : 'none';
        if (dw) dw.style.display = (type === 'histfull' || type === 'daily') ? 'block' : 'none';
        if (qw) qw.style.display = (type === 'qrlabel') ? 'block' : 'none';
        if (bw) bw.style.display = 'block';
        var fw = document.getElementById('rptFmtWrap');
        if (fw) fw.style.display = (type === 'stock') ? 'block' : 'none';
        _selectFmt('normal');
        if (type === 'qrlabel') loadQrItems();
      }

      // ===== ตัวเลือกรูปแบบรายงาน (รายงานพัสดุทั้งหมด) =====
      function _fmtBtn(fmt, icon, name, desc) {
        return '<div id="fmtBtn-' + fmt + '" onclick="_selectFmt(\'' + fmt + '\')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:12px;cursor:pointer;">' +
          '<div style="font-size:20px;">' + icon + '</div>' +
          '<div style="flex:1;"><div style="font-size:13.5px;font-weight:600;color:#202124;">' + name + '</div><div style="font-size:11.5px;color:#70757a;margin-top:2px;">' + desc + '</div></div>' +
          '<div id="fmtChk-' + fmt + '" style="width:18px;height:18px;border-radius:50%;border:2px solid #ccc;box-sizing:border-box;"></div></div>';
      }

      function _printBtnLabel() {
        if (_rptType === 'qrlabel') return '🖨️ พิมพ์ป้าย QR Code ที่เลือก';
        if (_rptType === 'stock' && _rptFmt === 'annex') return '🖨️ พิมพ์ (ผนวก ค)';
        return '🖨️ สร้างรายงานและพิมพ์';
      }

      function _selectFmt(fmt) {
        _rptFmt = fmt;
        ['normal','annex'].forEach(function(f) {
          var b = document.getElementById('fmtBtn-' + f);
          var c = document.getElementById('fmtChk-' + f);
          var on = (f === fmt);
          if (b) { b.style.borderColor = on ? '#1a73e8' : '#e0e0e0'; b.style.background = on ? '#e8f0fe' : 'white'; }
          if (c) { c.style.borderColor = on ? '#1a73e8' : '#ccc'; c.style.background = on ? 'radial-gradient(#1a73e8 45%, transparent 50%)' : 'transparent'; }
        });
        var annex = (_rptType === 'stock' && fmt === 'annex');
        var aw = document.getElementById('rptAnnexDateWrap');
        if (aw) aw.style.display = annex ? 'block' : 'none';
        var xb = document.getElementById('rptExcelBtn');
        if (xb) xb.style.display = annex ? 'flex' : 'none';

        var pBtn = document.getElementById('rptPrintBtn');
        if (pBtn) { pBtn.innerHTML = _printBtnLabel(); pBtn.style.display = annex ? 'none' : 'flex'; }
      }

      function _doReport() {
        var type = _rptType;
        var sheet = _rptSheet || 'all';
        var from = ''; var to = '';
        var needDate = (type === 'histfull' || type === 'daily');
        if (needDate) {
          from = document.getElementById('rptFrom').value || '';
          to   = document.getElementById('rptTo').value   || '';
          if (!from || !to) { showError('กรุณาเลือกช่วงวันที่'); return; }
        }
        if (type === 'qrlabel') {
          var selectedIds = Object.keys(_qrSelected);
          if (selectedIds.length === 0) {
            showError('กรุณาเลือกพัสดุที่ต้องการพิมพ์ป้ายอย่างน้อย 1 รายการ');
            return;
          }
          var selectedItems = _qrAllItems.filter(function(i) { return _qrSelected[i.id]; });
          _buildAndPrintQR(selectedItems);
          return;
        }
        if (type === 'stock' && _rptFmt === 'annex') { _runAnnex('print'); return; }
        var btn = document.getElementById('rptPrintBtn');
        if (btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังดึงข้อมูล...'; btn.disabled = true; }
        var onFail = function(err) {
          var b = document.getElementById('rptPrintBtn');
          if (b) { b.innerHTML = _printBtnLabel(); b.disabled = false; }
          showError('โหลดข้อมูลไม่สำเร็จ: ' + (err && err.message ? err.message : 'กรุณาลองใหม่'));
        };
        if (type === 'stock') {
          google.script.run.withSuccessHandler(function(items) {
            var filtered = sheet === 'all' ? items : items.filter(function(i) { return i.sheetName === sheet; });
            _buildAndPrint('stock', filtered, '', '', sheet);
          }).withFailureHandler(onFail).getTotalItemsList('');
        } else if (type === 'low') {
          google.script.run.withSuccessHandler(function(d) {
            var items = (d.lowStockItems || []).slice();
            if (sheet !== 'all') items = items.filter(function(i) { return i.sheetName === sheet; });
            items.sort(function(a, b) { return a.qty - b.qty; });
            _buildAndPrint('low', items, '', '', sheet);
          }).withFailureHandler(onFail).getDashboardData();
        } else if (type === 'histfull') {
          google.script.run.withSuccessHandler(function(rows) {
            _buildAndPrint('histfull', rows, from, to, 'all');
          }).withFailureHandler(onFail).getHistoryByRange(from, to);
        } else if (type === 'daily') {
          google.script.run.withSuccessHandler(function(rows) {
            _buildAndPrint('daily', rows, from, to, 'all');
          }).withFailureHandler(onFail).getDailySummaryByRange(from, to);
        }
      }

      function _buildAndPrintQR(items) {
        var existing = document.getElementById('_printDiv');
        if (existing) existing.remove();
        var qrUrls = items.map(function(item) {
        return 'https://quickchart.io/qr?text=' +
        encodeURIComponent(QR_SCRIPT_URL + '?id=' + item.id) +
        '&size=300&margin=1';
        });
        var loadPromises = qrUrls.map(function(url) {
        return new Promise(function(resolve) {
        var img = new Image();
        img.onload = function() { resolve(url); };
        img.onerror = function() { resolve(url); };
        img.src = url;
        });
        });
        var btn = document.getElementById('rptPrintBtn');
        if (btn) {
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังโหลด QR Code...';
        btn.disabled = true;
        }
        Promise.all(loadPromises).then(function() {
        var cardsHTML = items.map(function(item, idx) {
        var qrUrl = qrUrls[idx];
        return '<div class="qr-label-card">' +
        '<div class="qr-label-top">' +
          '<div class="qr-label-col">' +
            '<div class="qr-label-lbl">หมายเลขพัสดุ</div>' +
            '<div class="qr-label-id">' + item.id + '</div>' +
          '</div>' +
          '<div class="qr-label-col">' +
            '<div class="qr-label-lbl">ชื่อพัสดุ</div>' +
            '<div class="qr-label-name">' + item.name + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="qr-label-qrwrap">' +
          '<img src="' + qrUrl + '" width="106" height="106">' +
        '</div>' +
        '</div>';
        }).join('');
        var div = document.createElement('div');
        div.id = '_printDiv';
        div.className = 'print-only';
        div.innerHTML =
        '<div class="p-header">' +
        // [CHANGE] ชื่อหน่วยงานที่หัวรายงานที่พิมพ์
        '<h1>กองบิน ๗</h1>' +
        '<h2>ป้าย QR Code พัสดุ</h2>' +
        '<p>จำนวน ' + items.length + ' ป้าย</p>' +
        '</div>' +
        '<div class="qr-label-grid">' + cardsHTML + '</div>';
        document.body.appendChild(div);
        var ov = document.getElementById('reportOverlay');
        if (ov) ov.remove();
        setTimeout(function() {
          window.print();
          if (btn) {
            btn.innerHTML = '🖨️ พิมพ์ป้าย QR Code ที่เลือก';
            btn.disabled = false;
          }
          }, 1000);
        });
      }

      function _tStock(items) {
        if (!items || items.length === 0) return '<p style="text-align:center;color:#999;padding:20px;">ไม่มีข้อมูล</p>';
        var rows = items.map(function(item, i) {
          var qBadge = item.qty === 0 ? '<span class="p-badge p-red">หมด</span>' : item.qty <= 5 ? '<span class="p-badge p-warn">ใกล้หมด</span>' : '<span class="p-badge p-ok">ปกติ</span>';
          return '<tr><td>'+(i+1)+'</td><td><b>'+item.name+'</b></td><td>'+item.id+'</td><td>'+(item.location||'-')+'</td><td>'+item.sheetName+'</td><td style="text-align:center;font-weight:700;">'+item.qty+'&nbsp;'+qBadge+'</td></tr>';
        }).join('');
        return '<table class="p-table"><thead><tr><th>#</th><th>ชื่อพัสดุ</th><th>หมายเลข ID</th><th>ที่เก็บ</th><th>สายงาน</th><th>คงเหลือ</th></tr></thead><tbody>'+rows+'</tbody></table>';
      }

      function _tLow(items) {
        if (!items || items.length === 0) return '<p style="text-align:center;color:#34a853;padding:20px;">✅ ไม่มีพัสดุใกล้หมด</p>';
        var rows = items.map(function(item, i) {
          var isZero = item.qty === 0;
          var badge  = isZero ? '<span class="p-badge p-red">หมดแล้ว!</span>' : '<span class="p-badge p-warn">เหลือน้อย</span>';
          return '<tr><td>'+(i+1)+'</td><td><b>'+item.name+'</b></td><td>'+item.id+'</td><td>'+item.sheetName+'</td><td style="text-align:center;font-weight:700;'+(isZero?'color:#d93025;':'color:#e37400;')+'">'+item.qty+'</td><td>'+badge+'</td></tr>';
        }).join('');
        return '<table class="p-table"><thead><tr><th>#</th><th>ชื่อพัสดุ</th><th>หมายเลข ID</th><th>สายงาน</th><th>คงเหลือ</th><th>สถานะ</th></tr></thead><tbody>'+rows+'</tbody></table>';
      }

      function _tHistFull(rows) {
        if (!rows || rows.length === 0) return '<p style="text-align:center;color:#999;padding:20px;">ไม่มีรายการในช่วงวันที่นี้</p>';
        var received = rows.filter(function(r) { return r.type === 'รับเข้า'; });
        var issued   = rows.filter(function(r) { return r.type === 'จ่ายออก'; });
        function buildSection(items, isReceive) {
          if (items.length === 0) return '';
          var color  = isReceive ? '#1e8e3e' : '#d93025';
          var header = '<div style="font-size:14px;font-weight:700;color:'+color+';margin:14px 0 6px;padding:6px 10px;background:'+(isReceive?'#e6f4ea':'#fce8e6')+';border-radius:6px;">'+(isReceive?'📥 รายการรับเข้า':'📤 รายการจ่ายออก')+' ('+items.length+' รายการ)</div>';
          var rws = items.map(function(r, i) {
            var dateStr = isReceive ? r.dateIn : r.dateOut;
            var bal = (r.balance !== null && r.balance !== undefined) ? r.balance : '-';
            return '<tr><td style="text-align:center;">'+(i+1)+'</td><td style="white-space:nowrap;font-size:12px;">'+dateStr+'</td><td>'+r.name+'</td><td style="text-align:center;">'+(r.unit||'-')+'</td><td style="text-align:center;font-weight:700;color:'+color+';">'+r.amount+'</td><td style="text-align:center;">'+bal+'</td></tr>';
          }).join('');
          return header+'<table class="p-table"><thead><tr><th style="width:30px;">#</th><th>วันที่/เวลา</th><th>ชื่อพัสดุ</th><th style="width:80px;">หน่วยงาน</th><th style="width:60px;">จำนวน</th><th style="width:80px;">ยอดคงเหลือ</th></tr></thead><tbody>'+rws+'</tbody></table>';
        }
        return buildSection(received, true) + buildSection(issued, false);
      }

      function _tDailySummary(rows) {
        if (!rows || rows.length === 0) return '<p style="text-align:center;color:#999;padding:20px;">ไม่มีข้อมูลในช่วงวันที่นี้</p>';
        var byDate = {}; var dateOrder = [];
        rows.forEach(function(r) {
          if (!byDate[r.dateStr]) { byDate[r.dateStr] = []; dateOrder.push(r.dateStr); }
          byDate[r.dateStr].push(r);
        });
        return dateOrder.map(function(dateStr) {
          var items = byDate[dateStr];
          var totalRec = 0; var totalIss = 0;
          var rwsHTML = items.map(function(item, i) {
            totalRec += item.receive; totalIss += item.issue;
            var bal      = (item.balance !== null && item.balance !== undefined) ? item.balance : '-';
            var balColor = item.balance === 0 ? 'color:#d93025;' : (item.balance !== null && item.balance <= 5 ? 'color:#e37400;' : 'color:#1e8e3e;');
            return '<tr><td style="text-align:center;">'+(i+1)+'</td><td>'+item.name+'</td><td style="text-align:center;color:#1e8e3e;font-weight:700;">'+(item.receive>0?item.receive:'-')+'</td><td style="text-align:center;color:#d93025;font-weight:700;">'+(item.issue>0?item.issue:'-')+'</td><td style="text-align:center;font-weight:700;'+balColor+'">'+bal+'</td></tr>';
          }).join('');
          return '<div style="font-size:14px;font-weight:700;color:#1a73e8;margin:14px 0 6px;padding:6px 10px;background:#e8f0fe;border-radius:6px;">📅 วันที่ '+dateStr+' ('+items.length+' รายการ)</div>' +
            '<table class="p-table"><thead><tr><th style="width:30px;">#</th><th>ชื่อพัสดุ</th><th style="width:70px;">รับรวม</th><th style="width:70px;">จ่ายรวม</th><th style="width:90px;">คงเหลือ ณ สิ้นวัน</th></tr></thead><tbody>' +
            rwsHTML +
            '<tr style="background:#f8f9fa;font-weight:700;"><td colspan="2" style="text-align:right;color:#5f6368;">รวมวันนี้</td><td style="text-align:center;color:#1e8e3e;">'+(totalRec>0?totalRec:'-')+'</td><td style="text-align:center;color:#d93025;">'+(totalIss>0?totalIss:'-')+'</td><td></td></tr>' +
            '</tbody></table>';
        }).join('');
      }

      function loadQrItems() {
        var list = document.getElementById('qrItemList');
        if (list) list.innerHTML = '<div class="dd-empty"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>';
        google.script.run.withSuccessHandler(function(items) {
          _qrAllItems = items || [];
          renderQrItemList(getFilteredQrItems(''));
        }).getTotalItemsList('');
      }

      function getFilteredQrItems(query) {
        var base = (_rptSheet === 'all') ? _qrAllItems : _qrAllItems.filter(function(i) { return i.sheetName === _rptSheet; });
        if (!query) return base;
        var lq = query.toLowerCase();
        return base.filter(function(i) {
          return i.name.toLowerCase().indexOf(lq) > -1 || i.id.toLowerCase().indexOf(lq) > -1;
        });
      }

      function filterQrItems(q) {
        renderQrItemList(getFilteredQrItems(q));
      }

      function renderQrItemList(items) {
        var list = document.getElementById('qrItemList');
        if (!list) return;
        if (!items || items.length === 0) {
          list.innerHTML = '<div class="dd-empty">ไม่พบรายการ</div>';
          updateQrCount();
          return;
        }
        list.innerHTML = items.map(function(item) {
          var safeId = item.id.replace(/'/g, "\\'");
          var checked = _qrSelected[item.id] ? 'checked' : '';
          var rowCls  = _qrSelected[item.id] ? 'qr-item-row checked' : 'qr-item-row';
          return `
            <div class="${rowCls}" onclick="toggleQrItemRow('${safeId}')">
              <input type="checkbox" ${checked} onclick="event.stopPropagation();toggleQrItemRow('${safeId}')">
              <div class="qi-info">
                <div class="qi-name">${item.name}</div>
                <div class="qi-sub">ID: ${item.id} | ${item.sheetName}</div>
              </div>
            </div>`;
        }).join('');
        updateQrCount();
      }

      function toggleQrItemRow(id) {
        if (_qrSelected[id]) { delete _qrSelected[id]; } else { _qrSelected[id] = true; }
        var q = document.getElementById('qrSearchInput');
        renderQrItemList(getFilteredQrItems(q ? q.value : ''));
      }

      function toggleQrSelectAll() {
        var q = document.getElementById('qrSearchInput');
        var visible = getFilteredQrItems(q ? q.value : '');
        var allChecked = visible.length > 0 && visible.every(function(i) { return _qrSelected[i.id]; });
        visible.forEach(function(i) {
          if (allChecked) { delete _qrSelected[i.id]; } else { _qrSelected[i.id] = true; }
        });
        renderQrItemList(visible);
      }

      function updateQrCount() {
        var n = Object.keys(_qrSelected).length;
        var badge = document.getElementById('qrCountBadge');
        if (badge) badge.textContent = 'เลือกแล้ว ' + n + ' รายการ';
        var allBtn = document.getElementById('qrSelectAllBtn');
        if (allBtn) {
          var q = document.getElementById('qrSearchInput');
          var visible = getFilteredQrItems(q ? q.value : '');
          var allChecked = visible.length > 0 && visible.every(function(i) { return _qrSelected[i.id]; });
          allBtn.textContent = allChecked ? 'ยกเลิกที่เลือก' : 'เลือกทั้งหมด';
          allBtn.className   = allChecked ? 'qr-select-all-btn active' : 'qr-select-all-btn';
        }
      }

      function _buildAndPrint(type, data, from, to, sheet) {
        var btn = document.getElementById('rptPrintBtn');
        var existing = document.getElementById('_printDiv');
        if (existing) existing.remove();
        var now = new Date();
        var dateStr = now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
        var timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        var titleMap = {
        stock:    'รายงานพัสดุทั้งหมด',
        low:      'รายงานพัสดุใกล้หมด (≤5)',
        histfull: 'รายงานประวัติรับ-จ่าย',
        daily:    'รายงานสรุปรายวัน'
        };
        var subtitleMap = {
        stock:    'สายงาน: ' + (sheet === 'all' ? 'ทั้งหมด' : sheet),
        low:      'สายงาน: ' + (sheet === 'all' ? 'ทั้งหมด' : sheet) + ' | เรียงจากจำนวนน้อยสุด',
        histfull: 'ช่วงวันที่: ' + _formatDateTH(from) + ' ถึง ' + _formatDateTH(to),
        daily:    'ช่วงวันที่: ' + _formatDateTH(from) + ' ถึง ' + _formatDateTH(to)
        };
        var tableHTML = '';
        if (type === 'stock')    tableHTML = _tStock(data);
        if (type === 'low')      tableHTML = _tLow(data);
        if (type === 'histfull') tableHTML = _tHistFull(data);
        if (type === 'daily')    tableHTML = _tDailySummary(data);
        var countLabel = '';
        if (type === 'stock' || type === 'low') countLabel = 'จำนวน ' + (data ? data.length : 0) + ' รายการ';
        if (type === 'histfull' || type === 'daily') countLabel = 'จำนวน ' + (data ? data.length : 0) + ' รายการ';
        var div = document.createElement('div');
        div.id = '_printDiv';
        div.className = 'print-only';
        div.innerHTML =
        '<div class="p-header">' +
        // [CHANGE] ชื่อหน่วยงานที่หัวรายงานที่พิมพ์
        '<h1>กองบิน ๗</h1>' +
        '<h2>' + (titleMap[type] || 'รายงาน') + '</h2>' +
        '<p>' + (subtitleMap[type] || '') + '</p>' +
        '<p>' + countLabel + ' | พิมพ์เมื่อ: ' + dateStr + ' เวลา ' + timeStr + ' น.</p>' +
        '</div>' +
        tableHTML +
        // [CHANGE] ชื่อระบบ/หน่วยงานที่ท้ายรายงานที่พิมพ์
        '<div class="p-footer">ระบบจัดการคลังพัสดุ กองบิน ๗ | พิมพ์เมื่อ ' + dateStr + ' ' + timeStr + ' น.</div>';
        document.body.appendChild(div);
        var ov = document.getElementById('reportOverlay');
        if (ov) ov.remove();
        if (btn) { btn.innerHTML = '🖨️ สร้างรายงานและพิมพ์'; btn.disabled = false; }
        setTimeout(function() {
          window.print();
        }, 1000);
      }

      // ============================================================
      //  บัญชีตรวจสอบพัสดุ (ผนวก ค) — พิมพ์ / บันทึกเป็น Excel
      // ============================================================
      // [CHANGE-ถ้าสายต่างจากต้นแบบ] รายการสายในไฟล์ Excel ผนวก ค: key = ชื่อชีทในระบบ, sheet = ชื่อชีทใน Excel, title = ชื่อเต็มในหัวกระดาษ
      // (สายที่ไม่มี key ตรงกับชีทในระบบ จะขึ้น "ไม่มี" ถ้าเพิ่มสายใหม่ ต้องเพิ่มชื่อชีทใน getAnnexItems() ของ Code.gs ด้วย)
      var ANNEX_LINES = [
        { key: 'สายสื่อสาร',    sheet: 'คงคลัง สายสื่อสาร',    title: 'สายสื่อสารอิเล็กทรอนิกส์และการภาพ' },
        { key: 'สายพลา',        sheet: 'คงคลัง สายพลาธิการ',   title: 'สายพลาธิการ' },
        { key: 'สายช่างอากาศ',  sheet: 'คงคลัง สายช่างอากาศ',  title: 'สายช่างอากาศ' },
        { key: 'สายสรรพาวุธ',   sheet: 'คงคลัง สายสรรพาวุธ',   title: 'สายสรรพาวุธ' },
        { key: 'สายขนส่ง',      sheet: 'คงคลัง สายขนส่ง',      title: 'สายขนส่ง' },
        { key: 'สายช่างโยธา',   sheet: 'คงคลัง สายช่างโยธา',   title: 'สายช่างโยธา' },
        { key: 'สายเชื้อเพลิง', sheet: 'คงคลัง สายเชื้อเพลิง', title: 'สายเชื้อเพลิง' },
        { key: 'สายแพทย์',      sheet: 'คงคลัง สายแพทย์',      title: 'สายแพทย์' }
      ];
      var ANNEX_COLS = ['ลำดับ','หมายเลขพัสดุ','ชื่อพัสดุ','หน่วยนับ','จำนวนตามบัญชี','จำนวนนับได้','ขาด','เกิน','หมายเหตุ'];
      // [CHANGE] ยศ/ตำแหน่งผู้ตรวจพัสดุ ที่แสดงท้ายกระดาษทุกหน้า (ANNEX_SIGN1 และ ANNEX_SIGN2)
      var ANNEX_SIGN1 = 'เจ้าหน้าที่ตรวจสอบพัสดุ    น.ต. .........................................';
      var ANNEX_SIGN2 = '                                พ.อ.อ. .....................................';

      function _annexLinesFor(sheet) {
        return sheet === 'all' ? ANNEX_LINES : ANNEX_LINES.filter(function(l) { return l.key === sheet; });
      }
      function _esc(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      function _thaiDigits(t) { return String(t).replace(/[0-9]/g, function(d) { return '๐๑๒๓๔๕๖๗๘๙'.charAt(+d); }); }
      function _annexShortDate(dateStr) {
        var p = dateStr.split('-');
        var months = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
        return _thaiDigits(parseInt(p[2], 10)) + ' ' + months[parseInt(p[1], 10)] + _thaiDigits(String((parseInt(p[0], 10) + 543) % 100));
      }
      function _annexHeaderLines(line, from, to) {
        return [
          'ผนวก  ค',  // [CHANGE-ถ้าแบบฟอร์มต่าง] ข้อความหัวฟอร์ม (บรรทัดถัดไปคือชื่อบัญชี "ในรอบ 1 ปี")
          'บัญชีตรวจสอบพัสดุประเภทในคลังทุกประเภทในรอบ 1 ปี  ' + line.title,
          'หน่วย คลังกลาง',  // [CHANGE] ชื่อหน่วย/คลังในหัวกระดาษ ผนวก ค
          'วันที่ทำการตรวจสอบพัสดุ ตั้งแต่ ' + _annexShortDate(from) + ' ถึง ' + _annexShortDate(to)
        ];
      }
      function _annexGroup(items) {
        var g = {};
        (items || []).filter(function(it) { return it.qty > 0; }).forEach(function(it) { (g[it.sheetName] = g[it.sheetName] || []).push(it); });
        return g;
      }

      function _runAnnex(mode) {
        var from = (document.getElementById('annexFrom') || {}).value || '';
        var to   = (document.getElementById('annexTo')   || {}).value || '';
        if (!from || !to) { showError('กรุณาเลือกวันที่ทำการตรวจสอบพัสดุ'); return; }
        if (to < from)    { showError('วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่มต้น'); return; }
        var sheet = _rptSheet || 'all';
        var pBtn = document.getElementById('rptPrintBtn');
        var xBtn = document.getElementById('rptExcelBtn');
        var active = (mode === 'excel') ? xBtn : pBtn;
        var oldHTML = active ? active.innerHTML : '';
        var restore = function() {
          if (pBtn) { pBtn.disabled = false; pBtn.innerHTML = _printBtnLabel(); }
          if (xBtn) { xBtn.disabled = false; xBtn.innerHTML = '📥 บันทึกเป็น Excel'; }
        };
        if (pBtn) pBtn.disabled = true;
        if (xBtn) xBtn.disabled = true;
        if (active) active.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังดึงข้อมูล...';
        var finished = false;
        var watchdog = setTimeout(function() {
          if (finished) return; finished = true;
          restore(); showError('ใช้เวลานานเกินไป กรุณาลองใหม่อีกครั้ง');
        }, 45000);
        var go = function(items) {
          if (finished) return; finished = true; clearTimeout(watchdog);
          var groups = _annexGroup(items);
          try {
            if (mode === 'excel') {
              var p = _exportAnnexExcel(groups, sheet, from, to);
              restore();
            } else { _buildAndPrintAnnex(groups, sheet, from, to); }
          } catch (e) { restore(); showError('สร้างรายงานไม่สำเร็จ: ' + e.message); }
        };
        // ใช้ข้อมูลที่โหลดไว้แล้วภายใน 60 วินาที เพื่อไม่ต้องรอซ้ำ
        if (_annexCache && (Date.now() - _annexCache.t) < 60000) { go(_annexCache.items); return; }
        google.script.run.withSuccessHandler(function(items) {
          _annexCache = { t: Date.now(), items: items };
          go(items);
        }).withFailureHandler(function(err) {
          if (finished) return; finished = true; clearTimeout(watchdog);
          restore();
          showError('โหลดข้อมูลไม่สำเร็จ: ' + (err && err.message ? err.message : 'กรุณาลองใหม่'));
        }).getAnnexItems();
      }
      var _annexCache = null;

      // ---------- พิมพ์ (A4 แนวนอน) ----------
      function _buildAndPrintAnnex(groups, sheet, from, to) {
        var existing = document.getElementById('_printDiv');
        if (existing) existing.remove();
        var lines = _annexLinesFor(sheet);
        var colW = [5, 15, 36, 7, 10, 9, 5, 5, 8];
        var colgroup = '<colgroup>' + colW.map(function(w) { return '<col style="width:' + w + '%">'; }).join('') + '</colgroup>';
        var html = '<div class="annex-wrap">' + lines.map(function(line) {
          var items = groups[line.key] || [];
          var hdr = _annexHeaderLines(line, from, to).map(function(t) {
            return '<tr><th class="annex-t" colspan="9">' + _esc(t) + '</th></tr>';
          }).join('');
          var colHead = '<tr>' + ANNEX_COLS.map(function(c) { return '<th class="annex-c">' + c + '</th>'; }).join('') + '</tr>';
          var body;
          if (items.length === 0) {
            body = '<tr><td class="c">ไม่มี</td><td class="c">ไม่มี</td><td class="c">ไม่มี</td><td class="c">ไม่มี</td><td class="c">ไม่มี</td><td class="c">ไม่มี</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr>';
          } else {
            body = items.map(function(it, i) {
              return '<tr><td class="c">' + (i + 1) + '</td><td class="c">' + _esc(it.id) + '</td><td>' + _esc(it.name) + '</td>' +
                     '<td class="c">' + _esc(it.unit) + '</td><td class="c">' + it.qty + '</td><td class="c">' + it.qty + '</td>' +
                     '<td class="c">-</td><td class="c">-</td><td>&nbsp;</td></tr>';
            }).join('');
          }
          return '<div class="annex-sec"><table class="annex-tbl">' + colgroup +
                 '<thead>' + hdr + colHead + '</thead><tbody>' + body + '</tbody>' +
                 '<tfoot><tr><td colspan="9" class="annex-sign">' + _esc(ANNEX_SIGN1) + '\n' + _esc(ANNEX_SIGN2) + '</td></tr></tfoot></table></div>';
        }).join('') + '</div>';
        var div = document.createElement('div');
        div.id = '_printDiv';
        div.className = 'print-only';
        div.innerHTML = html;
        document.body.appendChild(div);
        var ov = document.getElementById('reportOverlay');
        if (ov) ov.remove();
        document.documentElement.classList.add('annex-print');
        window.addEventListener('afterprint', function() {
          document.documentElement.classList.remove('annex-print');
        }, { once: true });
        setTimeout(function() { window.print(); }, 800);
      }

      // ---------- บันทึกเป็น Excel ----------
      function _exportAnnexExcel(groups, sheet, from, to) {
        if (typeof ExcelJS === 'undefined') { showError('โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'); return; }
        var lines = _annexLinesFor(sheet);
        var wb = new ExcelJS.Workbook();
        wb.creator = 'ระบบจัดการคลังพัสดุ กองบิน ๗';  // [CHANGE-ตามต้องการ] ชื่อผู้สร้างไฟล์ Excel
        wb.created = new Date();
        var thin = { style: 'thin', color: { argb: 'FF000000' } };
        var box  = { top: thin, left: thin, bottom: thin, right: thin };
        var FN_IT = 'TH SarabunIT๙', FN_PSK = 'TH SarabunPSK';
        var widths = [6.2, 18.8, 49, 8.5, 14.5, 12.5, 5.5, 5.5, 10.9];

        lines.forEach(function(line) {
          var items = groups[line.key] || [];
          var ws = wb.addWorksheet(line.sheet, {
            pageSetup: {
              paperSize: 9, orientation: 'landscape',
              fitToPage: true, fitToWidth: 1, fitToHeight: 0,
              margins: { left: 0.7086614, right: 0.7086614, top: 0.7480315, bottom: 1.15, header: 0.3, footer: 0.3 },
              printTitlesRow: '1:5'
            },
            headerFooter: { oddHeader: '&R&"TH SarabunIT๙,Regular"&14หน้า &P ของ &N หน้า', oddFooter: '&R&"TH SarabunIT๙,Regular"&16' + ANNEX_SIGN1 + '\n' + ANNEX_SIGN2 }
          });
          widths.forEach(function(w, i) { ws.getColumn(i + 1).width = w; });

          // ส่วนหัว 4 บรรทัด (รวมเซลล์ A:I)
          _annexHeaderLines(line, from, to).forEach(function(t, i) {
            var r = i + 1;
            ws.mergeCells(r, 1, r, 9);
            var c = ws.getCell(r, 1);
            c.value = t;
            c.font = { name: FN_IT, size: 16 };
            c.alignment = { horizontal: 'center', vertical: 'middle' };
            ws.getRow(r).height = 20.25;
          });

          // หัวตาราง
          ANNEX_COLS.forEach(function(t, i) {
            var c = ws.getCell(5, i + 1);
            c.value = t;
            c.font = { name: FN_IT, size: 16 };
            c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
            c.border = box;
          });
          ws.getRow(5).height = 40.5;

          var r = 6;
          if (items.length === 0) {
            for (var col = 1; col <= 9; col++) {
              ws.mergeCells(6, col, 8, col);
              var cc = ws.getCell(6, col);
              if (col <= 6) cc.value = 'ไม่มี';
              cc.font = { name: col === 3 ? FN_PSK : FN_IT, size: 16 };
              cc.alignment = { horizontal: 'center', vertical: 'middle' };
              for (var rr = 6; rr <= 8; rr++) ws.getCell(rr, col).border = box;
            }
            for (var h = 6; h <= 8; h++) ws.getRow(h).height = 20.25;
            r = 9;
          } else {
            items.forEach(function(it, idx) {
              var row = ws.getRow(r);
              var vals = [idx + 1, String(it.id), it.name, it.unit || '', it.qty, it.qty, '  -', '  -', ''];
              vals.forEach(function(v, i) {
                var c = row.getCell(i + 1);
                c.value = v;
                c.border = box;
                var isPSK = (i === 1 || i === 2);
                c.font = { name: isPSK ? FN_PSK : FN_IT, size: 16 };
                if (i === 1) c.numFmt = '@';
                c.alignment = {
                  horizontal: (i === 2 || i === 6 || i === 7) ? 'left' : 'center',
                  vertical: 'middle',
                  wrapText: (i === 2)
                };
              });
              var nLines = Math.max(1, Math.ceil(String(it.name).length / 44));
              row.height = 20.25 * nLines;
              r++;
            });
          }

          // ช่องลงชื่อผู้ตรวจ อยู่ที่ท้ายกระดาษ (Footer) ของทุกหน้าพิมพ์
        });

        var yy = String((parseInt(to.split('-')[0], 10) + 543) % 100);
        var fname = (lines.length === 1 ? lines[0].sheet : 'คงคลัง ทุกสาย') + ' ' + yy + '.xlsx';
        return wb.xlsx.writeBuffer().then(function(buf) {
          var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url; a.download = fname;
          document.body.appendChild(a);
          a.click();
          setTimeout(function() { a.remove(); URL.revokeObjectURL(url); }, 1500);
          showPopup('บันทึกไฟล์ ' + fname + ' แล้ว');
        }).catch(function(e) { showError('สร้างไฟล์ Excel ไม่สำเร็จ: ' + e.message); });
      }

      function _formatDateTH(dateStr) {
        if (!dateStr) return '-';
        var parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        var months = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
        return parseInt(parts[2]) + ' ' + months[parseInt(parts[1])] + ' ' + (parseInt(parts[0]) + 543);
      }

      var LOADED_ITEM_ID = <?!= JSON.stringify(itemId) ?>;

    </script>
