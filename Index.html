<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!--
      Index.html — ฝั่งหน้าเว็บของระบบจัดการคลังพัสดุ
      วิธีหาจุดที่ต้องแก้เมื่อนำไปใช้หน่วยงานอื่น: ค้นหาข้อความ [CHANGE] (Ctrl+F)
        [CHANGE]        = ต้องแก้ทุกหน่วยงาน
        [CHANGE-ถ้า...] = แก้เฉพาะเมื่อหน่วยงานของคุณต่างจากต้นแบบ
    -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">

  <style>
      :root {
        --primary: #1a73e8;
        --success: #28a745;
        --danger: #d93025;
        --bg: #f8f9fa;
      }

      body {
        font-family: 'Kanit', sans-serif;
        font-size: 16px;
        background-color: var(--bg);
        margin: 0;
        padding: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .header {
        background: linear-gradient(135deg, #0b1c3f 0%, #1a5bb0 100%);
        padding: 25px 20px 45px 20px;
        border-radius: 20px;
        width: 100%;
        max-width: 450px;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
        margin-bottom: 0;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      }

      .header-content {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 50px 1fr 50px;
        align-items: center;
        gap: 10px;
      }

      .header-icon {
        width: 45px; height: 45px; font-size: 36px; color: #f6c23e;
        display: flex; align-items: center; justify-content: center;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        transform: translateY(6px);
      }

      .header-text {
        display: flex; flex-direction: column;
        align-items: center; text-align: center;
      }

      .header h2 {
        margin: 0; font-size: 20px; color: #ffffff; font-weight: 600;
      }

      .header p {
        margin: 0; font-size: 10px; color: #d2e3fc;
        font-weight: 300; letter-spacing: 0.5px; margin-top: 4px;
      }

      .header-logo img {
        height: 50px;
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
        transform: translateY(6px);
      }

      .card {
        background: white;
        width: 100%; max-width: 450px;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        box-sizing: border-box;
        margin-top: 5px;
      }

      .item-info {
        text-align: left;
        margin-bottom: 25px;
        border-bottom: 1px dashed #e0e0e0;
        padding-bottom: 20px;
      }

      .label { font-size: 14px; color: #5f6368; margin-bottom: 2px; }

      .item-id {
        font-size: 28px; color: var(--primary); font-weight: 700;
        margin-bottom: 8px; word-break: break-all; line-height: 1.2;
      }

      .item-name {
        font-size: 22px; font-weight: 700; color: #202124;
        margin-bottom: 15px; line-height: 1.3;
      }

      .loc-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

      .loc-box {
        background: #e8f0fe; padding: 12px; border-radius: 12px;
        text-align: center; display: flex; flex-direction: column; justify-content: center;
      }

      .loc-text { font-size: 16px; font-weight: 700; color: #1967d2; margin-top: 4px; }

      .mfg-box {
        background: #fff3e0; padding: 12px; border-radius: 12px;
        text-align: center; margin-top: 12px;
        display: flex; flex-direction: column; justify-content: center;
        border: 1px solid #ffe0b2;
      }

      .mfg-text { font-size: 16px; font-weight: 700; color: #e65100; margin-top: 4px; }

      .reg-box {
        background: #e8f5e9; padding: 12px; border-radius: 12px;
        text-align: center; margin-top: 12px;
        display: flex; flex-direction: column; justify-content: center;
        border: 1px solid #c8e6c9;
      }

      .reg-text { font-size: 16px; font-weight: 700; color: #2e7d32; margin-top: 4px; }

      .qty-control {
        display: flex; align-items: center; justify-content: center;
        gap: 20px; margin: 15px 0;
      }

      .qty-input {
        width: 140px; height: 70px;
        font-size: 48px !important; font-weight: 700;
        text-align: center; border: 2px solid #e8eaed;
        border-radius: 16px; background: white;
        color: var(--primary); box-sizing: border-box; outline: none;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
      }

      .btn-circle {
        width: 60px; height: 60px; border-radius: 50%; border: none;
        color: white; font-size: 28px; font-weight: 300;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.15); flex-shrink: 0;
      }
      .btn-circle:active { transform: scale(0.9); }
      .btn-minus { background-color: var(--danger); }
      .btn-plus  { background-color: var(--success); }

      .adjust-section { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #e0e0e0; }

      .adjust-controls {
        display: flex; gap: 8px; justify-content: center;
        margin-top: 10px; align-items: center;
      }

      .adjust-input {
        width: 80px; flex: none; height: 50px;
        border: 2px solid #1a73e8; border-radius: 12px;
        text-align: center; font-size: 22px !important;
        font-weight: 600; outline: none; box-sizing: border-box;
      }
      .adjust-input:focus { border: 2px solid var(--primary); }

      .btn-adjust {
        flex: 1; max-width: 100px; height: 50px; justify-content: center;
        border: none; border-radius: 10px; color: white;
        font-family: 'Kanit', sans-serif; font-weight: 600;
        font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 4px;
      }
      .btn-add    { background-color: var(--success); }
      .btn-deduct { background-color: var(--danger); }

      .btn-save {
        width: 100%; padding: 15px; border-radius: 12px; border: none;
        background: var(--primary); color: white; font-size: 18px; font-weight: 600;
        cursor: pointer; margin-top: 10px; display: flex;
        align-items: center; justify-content: center; gap: 8px;
        box-shadow: 0 4px 10px rgba(26,115,232,0.3);
        font-family: 'Kanit', sans-serif;
      }

      #msg { text-align: center; margin-top: 10px; min-height: 28px; font-size: 16px; font-weight: 600; }
      .loading { text-align: center; color: #70757a; padding: 60px; font-size: 18px; }

      .popup-error {
        position: fixed; top: 20px; right: 20px; background: #d93025;
        color: white; padding: 14px 20px; border-radius: 12px; font-weight: 500;
        box-shadow: 0 6px 20px rgba(0,0,0,0.2); z-index: 9999; animation: slideIn 0.4s ease;
      }

      @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to   { transform: translateX(0);    opacity: 1; }
      }

      .popup-success {
        position: fixed; top: 20px; background: var(--success); color: white;
        padding: 12px 25px; border-radius: 25px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 9999;
      }

      .search-container {
        width: 100%; max-width: 450px; margin-bottom: 15px; position: relative;
      }

      .search-box {
        width: 100%; padding: 14px 65px 14px 20px;
        border-radius: 30px; border: none;
        box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        font-family: 'Kanit', sans-serif; font-size: 15px;
        box-sizing: border-box; transition: 0.3s; outline: none;
      }
      .search-box:focus { box-shadow: 0 6px 20px rgba(26,115,232,0.15); }

      .scan-btn-inline {
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        background: linear-gradient(135deg, #e53935 0%, #c62828 100%);
        border: none; border-radius: 10px; width: 44px; height: 36px;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 10px rgba(217,48,37,0.3); transition: 0.2s;
      }
      .scan-btn-inline:active { transform: translateY(-50%) scale(0.92); }
      .scan-btn-inline i { color: white; font-size: 16px; }

      #qrLoadingOverlay {
        display: none; position: fixed; top: 0; left: 0;
        width: 100%; height: 100%; background: rgba(0,0,0,0.6);
        z-index: 9999; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px;
      }
      #qrLoadingOverlay.active { display: flex; }
      .qr-loading-box {
        background: white; padding: 30px 40px; border-radius: 20px;
        text-align: center; font-family: 'Kanit', sans-serif;
      }
      .qr-loading-box i { font-size: 40px; color: var(--primary); margin-bottom: 12px; display: block; }
      .qr-loading-box p { margin: 0; color: #202124; font-size: 16px; font-weight: 600; }
      .qr-loading-box small { color: #5f6368; font-size: 13px; }

      .search-results {
        position: absolute; top: 100%; left: 0; right: 0;
        background: white; border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.15); z-index: 1000;
        margin-top: 5px; display: none; max-height: 300px; overflow-y: auto;
      }

      .result-item {
        padding: 12px 20px; border-bottom: 1px solid #f1f3f4;
        cursor: pointer; transition: 0.2s;
      }
      .result-item:last-child { border-bottom: none; }
      .result-item:hover { background-color: #f8f9fa; }
      .result-item .res-name { font-weight: 600; color: #202124; display: block; }
      .result-item .res-sub  { font-size: 12px; color: #70757a; }

      #unitOverlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); display: flex;
        align-items: center; justify-content: center; z-index: 10000;
      }
      .unit-modal {
        background: white; padding: 20px; border-radius: 20px;
        width: 90%; max-width: 400px; text-align: center;
      }
      .unit-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
        max-height: 300px; overflow-y: auto; padding: 10px;
      }
      .unit-btn {
        padding: 10px; border: 1px solid #e0e0e0; border-radius: 10px;
        background: #f8f9fa; cursor: pointer; font-family: 'Kanit';
      }
      .unit-btn:hover { background: #e8f0fe; border-color: var(--primary); }

      #qr-hidden-reader { display: none; }

      @media (max-width: 768px) {
        .title-th { font-size: 18px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .subtitle-en { font-size: 12px !important; margin-top: 4px; }
      }

      .dashboard-wrap { display: flex; flex-direction: column; gap: 14px; }
      .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .dash-card {
        border-radius: 14px; padding: 14px 12px;
        display: flex; flex-direction: column; align-items: center;
        gap: 4px; text-align: center;
      }
      .dash-card .dc-icon { font-size: 22px; margin-bottom: 2px; }
      .dash-card .dc-val  { font-size: 30px; font-weight: 700; line-height: 1; }
      .dash-card .dc-lbl  { font-size: 12px; font-weight: 400; opacity: 0.85; }
      .dc-blue   { background: #e8f0fe; color: #1a73e8; }
      .dc-green  { background: #e6f4ea; color: #1e8e3e; }
      .dc-red    { background: #fce8e6; color: #d93025; }
      .dc-orange { background: #fef3e2; color: #e37400; }
      .dash-section-title {
        font-size: 13px; font-weight: 600; color: #5f6368; margin-bottom: 4px;
        display: flex; align-items: center; gap: 6px;
      }
      .low-stock-list { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
      .low-stock-row {
        display: flex; align-items: center; justify-content: space-between;
        background: #fff8f0; border: 1px solid #fce8c3;
        border-radius: 10px; padding: 8px 12px; cursor: pointer; transition: 0.15s;
      }
      .low-stock-row:hover { background: #fef3e2; }
      .low-stock-row .ls-name {
        font-size: 13px; font-weight: 600; color: #202124; flex: 1;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 8px;
      }
      .ls-badge { background: #e37400; color: white; border-radius: 20px; padding: 2px 10px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
      .ls-badge.zero { background: #d93025; }
      .dash-empty { text-align: center; color: #34a853; font-size: 14px; padding: 10px; background: #e6f4ea; border-radius: 10px; }
      .dash-loading { text-align: center; color: #70757a; padding: 40px; font-size: 16px; }
      .dash-updated { text-align: right; font-size: 11px; color: #9aa0a6; margin-top: 2px; }
      .dash-card:active { transform: scale(0.97); transition: transform 0.1s; }

      .dd-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.55);
        z-index: 20000; display: flex; align-items: flex-end; justify-content: center;
        animation: fadeIn 0.2s ease;
      }
      @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
      .dd-sheet {
        background: white; width: 100%; max-width: 480px;
        border-radius: 24px 24px 0 0; padding: 0 0 30px 0;
        max-height: 92vh; height: 85vh;
        display: flex; flex-direction: column;
        animation: slideUp 0.25s ease;
      }
      @keyframes slideUp {
        from { transform: translateY(60px); opacity:0; }
        to   { transform: translateY(0);    opacity:1; }
      }
      .dd-handle { width: 40px; height: 4px; background: #e0e0e0; border-radius: 2px; margin: 14px auto 0; }
      .dd-header { padding: 14px 20px 10px; border-bottom: 1px solid #f1f3f4; flex-shrink: 0; }
      .dd-title  { font-size: 17px; font-weight: 700; color: #202124; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
      .dd-tabs   { display: flex; gap: 6px; flex-wrap: wrap; }
      .dd-tab {
        padding: 5px 14px; border-radius: 20px; border: 1.5px solid #e0e0e0;
        background: white; font-family: 'Kanit'; font-size: 13px; cursor: pointer; transition: 0.15s; color: #5f6368;
      }
      .dd-tab.active { background: #1a73e8; color: white; border-color: #1a73e8; }
      .dd-body { overflow-y: auto; flex: 1; padding: 10px 16px; }
      .dd-row {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 12px; border-radius: 12px; margin-bottom: 6px;
        background: #f8f9fa; cursor: pointer; transition: 0.15s; gap: 10px;
      }
      .dd-row:hover { background: #e8f0fe; }
      .dd-row-info { flex: 1; min-width: 0; }
      .dd-row-name { font-size: 14px; font-weight: 600; color: #202124; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dd-row-sub  { font-size: 12px; color: #70757a; margin-top: 2px; }
      .dd-badge        { padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
      .dd-badge-blue   { background:#e8f0fe; color:#1a73e8; }
      .dd-badge-orange { background:#fef3e2; color:#e37400; }
      .dd-badge-zero   { background:#fce8e6; color:#d93025; }
      .dd-badge-green  { background:#e6f4ea; color:#1e8e3e; }
      .dd-badge-red    { background:#fce8e6; color:#d93025; }
      .dd-date-bar     { display: flex; align-items: center; gap: 8px; padding: 8px 0 6px; }
      .dd-empty  { text-align: center; padding: 40px 20px; color: #9aa0a6; font-size: 15px; }
      .dd-hist-row { border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; background: #f8f9fa; }
      .dd-hist-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
      .dd-hist-name { font-size: 14px; font-weight: 600; color: #202124; }
      .dd-hist-sub  { font-size: 12px; color: #70757a; }
      .dd-search    { width: 100%; padding: 9px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-family: 'Kanit'; font-size: 14px; box-sizing: border-box; outline: none; margin-bottom: 8px; }
      .dd-search:focus { border-color: #1a73e8; }
      .dd-count     { font-size: 12px; color: #9aa0a6; text-align: right; margin-bottom: 4px; }

      .qr-select-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      .qr-select-all-btn { padding: 7px 14px; border-radius: 20px; border: 1.5px solid #1a73e8; background: white; color: #1a73e8; font-family: 'Kanit'; font-size: 12px; cursor: pointer; white-space: nowrap; }
      .qr-select-all-btn.active { background: #1a73e8; color: white; }
      .qr-count-badge { font-size: 12px; color: #5f6368; font-weight: 600; flex-shrink: 0; }
      .qr-item-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; background: #f8f9fa; margin-bottom: 6px; cursor: pointer; transition: 0.15s; }
      .qr-item-row:hover { background: #eef2f5; }
      .qr-item-row.checked { background: #e8f0fe; }
      .qr-item-row input[type=checkbox] { width: 19px; height: 19px; flex-shrink: 0; accent-color: #1a73e8; cursor: pointer; }
      .qr-item-row .qi-info { flex: 1; min-width: 0; }
      .qr-item-row .qi-name { font-size: 13px; font-weight: 600; color: #202124; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .qr-item-row .qi-sub  { font-size: 11px; color: #70757a; margin-top: 2px; }

      .print-only { display: none !important; }
      @page { size: A4 portrait; margin: 12mm 15mm; }
      @page annex { size: A4 landscape; margin: 12mm 14mm; }
      @media print {
        html.annex-print, html.annex-print body { width: auto !important; }
        .annex-wrap { page: annex; width: 100%; color: #000; font-family: 'TH SarabunPSK','TH Sarabun New','Sarabun','Kanit',sans-serif; }
        .annex-sec { page: annex; page-break-before: always; break-before: page; }
        .annex-sec:first-child { page-break-before: auto; break-before: auto; }
        .annex-tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .annex-tbl thead { display: table-header-group; }
        .annex-tbl tr { page-break-inside: avoid; break-inside: avoid; }
        .annex-tbl th.annex-t { border: none; font-weight: 400; text-align: center; font-size: 17px; line-height: 1.35; padding: 0; background: none !important; color: #000 !important; }
        .annex-tbl th.annex-c { border: 1px solid #000; font-weight: 400; text-align: center; font-size: 15px; padding: 3px 2px; background: none !important; color: #000 !important; }
        .annex-tbl td { border: 1px solid #000; font-size: 15px; padding: 1px 5px; line-height: 1.3; vertical-align: middle; background: none !important; }
        .annex-tbl td.c { text-align: center; }
        .annex-tbl tfoot { display: table-footer-group; }
        .annex-tbl td.annex-sign { border: none; white-space: pre; font-size: 16px; line-height: 1.5; padding: 14px 0 0 45%; }
      }
      @media print {
        .header, .search-container, #qrLoadingOverlay, #qr-hidden-reader,
        .btn-save, .adjust-section, .qty-section, .qty-control,
        .dd-overlay, #unitOverlay, .popup-error, .popup-success,
        #content, #reportOverlay { display: none !important; }
        html, body {
          width: 210mm; background: white !important;
          padding: 0 !important; margin: 0 !important;
          font-family: 'Kanit', sans-serif; font-size: 14px;
          -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }
        .print-only { display: block !important; width: 100%; }
        .p-header { text-align: center; padding-bottom: 14px; border-bottom: 2.5px solid #1a73e8; margin-bottom: 16px; }
        .p-header h1 { font-size: 20px; font-weight: 700; color: #0b1c3f; margin: 0 0 4px; }
        .p-header h2 { font-size: 16px; font-weight: 600; color: #333; margin: 0 0 4px; }
        .p-header p  { font-size: 13px; color: #555; margin: 0; }
        .p-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .p-table th { background: #1a73e8 !important; color: white !important; padding: 8px 10px; text-align: left; font-size: 13px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .p-table td { padding: 7px 10px; border-bottom: 0.5px solid #ddd; vertical-align: middle; font-size: 13px; }
        .p-table tr:nth-child(even) td { background: #f5f5f5 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .p-badge { border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 700; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .p-ok   { background: #e6f4ea !important; color: #1e8e3e !important; }
        .p-warn { background: #fef3e2 !important; color: #e37400 !important; }
        .p-red  { background: #fce8e6 !important; color: #d93025 !important; }
        .p-footer { text-align: right; font-size: 11px; color: #888; margin-top: 14px; padding-top: 8px; border-top: 0.5px solid #eee; }
        .qr-label-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 4mm;
          margin-top: 6mm;
          width: 100%;
          box-sizing: border-box;
        }
        .qr-label-card {
          border: 1.5px dashed #999;
          border-radius: 4px;
          padding: 3mm 4mm;
          display: flex;
          flex-direction: column;
          gap: 2mm;
          page-break-inside: avoid;
          break-inside: avoid;
          box-sizing: border-box;
          min-width: 0;
          overflow: hidden;
        }
        .qr-label-top   { display: flex; gap: 3mm; }
        .qr-label-col   { flex: 1; min-width: 0; }
        .qr-label-lbl   { font-size: 9px; color: #666; margin-bottom: 1mm; }
        .qr-label-id    { font-size: 12px; font-weight: 700; color: #000; word-break: break-all; line-height: 1.2; }
        .qr-label-name  { font-size: 12px; font-weight: 700; color: #000; line-height: 1.25; }
        .qr-label-qrwrap { display: flex; justify-content: center; padding-top: 1mm; }
        .qr-label-qrwrap img { 
          width: 28mm; 
          height: 28mm; 
          display: block;
          -webkit-print-color-adjust: exact; 
          print-color-adjust: exact;
        }
      }
  </style>
  </head>
  <body>

    <div class="header">
      <div class="header-content">
        <div class="header-icon"><i class=" "></i></div>
        <div class="header-text">
          <!-- [CHANGE] ชื่อระบบ/ชื่อหน่วยงานที่หัวเว็บ (บรรทัด h2 นี้ และบรรทัดรองด้านล่างที่เขียนว่า Wing7) -->
          <h2>ระบบจัดการคลังพัสดุ กองบิน ๗</h2>
          <p>Logistics Management Information System | Wing7</p>
        </div>
        <div class="header-logo">
          <!-- [CHANGE] โลโก้หน่วยงาน → ใส่ลิงก์รูปของคุณแทน (ต้องเข้าถึงได้ตลอด) -->
          <img src="https://YOUR-DOMAIN/path/to/logo.png" alt="RTAF">
        </div>
      </div>
    </div>

    <!-- Search + Camera -->
    <div class="search-container">
      <input type="text" id="searchInput" class="search-box"
        placeholder="🔍 ค้นหาชื่อหรือหมายเลขพัสดุ..."
        oninput="handleSearch(this.value)"
        onfocus="showDefaultMenu()">
      <button class="scan-btn-inline" onclick="document.getElementById('qrFileInput').click()" title="สแกน QR Code">
        <i class="fas fa-camera"></i>
      </button>
      <input type="file" id="qrFileInput" accept="image/*" capture="environment"
        style="display:none" onchange="handleQrFile(this)">
      <div id="searchResults" class="search-results"></div>
    </div>

    <!-- QR Loading Overlay -->
    <div id="qrLoadingOverlay">
      <div class="qr-loading-box">
        <i class="fas fa-qrcode fa-spin"></i>
        <p>กำลังอ่าน QR Code...</p>
        <small>กรุณารอสักครู่</small>
      </div>
    </div>

    <div id="qr-hidden-reader"></div>

    <div id="content" class="card">
      <div class="dash-loading">
      <i class="fas fa-spinner fa-spin" style="margin-right:8px;color:#1a73e8;"></i>กำลังโหลดข้อมูลภาพรวม...
      </div>
    </div>

    <script>
      var currentItem  = null;
      var selectedUnit = "";
      const units = [
        "01 กทน.", "02 ผชอ.", "03 ผสอ.", "04 ผสพ.", "05 บชพ.", "06 ผขส.",
        "07 ผชย.", "08 ผพธ.", "09 แพทย์", "10 ผธก.", "11 ผกง.", "12 ทสห.",
        "13 ผสก.", "14 ผนบ.", "15 ฝ.701", "16 ฝ.702", "17 อย.", "18 ฝคก.",
        "19 ศฟฟ."
      ];

      function handleQrFile(input) {
        if (!input.files || !input.files[0]) return;
        var file = input.files[0];
        input.value = "";
        document.getElementById('qrLoadingOverlay').classList.add('active');
        var html5QrCode = new Html5Qrcode("qr-hidden-reader");
        html5QrCode.scanFile(file, true)
          .then(function(decodedText) {
            html5QrCode.clear();
            document.getElementById('qrLoadingOverlay').classList.remove('active');
            handleScan(decodedText);
          })
          .catch(function() {
            html5QrCode.clear();
            document.getElementById('qrLoadingOverlay').classList.remove('active');
            showError("อ่าน QR Code ไม่ได้ — กรุณาถ่ายให้ชัดขึ้นและใกล้ขึ้น");
          });
      }

      function handleScan(text) {
        var id = "";
        if (text.indexOf("?id=") > -1) {
          id = text.split("?id=")[1].split("&")[0].trim();
        } else {
          id = text.trim();
        }
        if (!id) { showError("QR Code ไม่ถูกต้อง"); return; }
        selectItem(id);
      }

      function showData(data) {
        if (!data) {
          document.getElementById('content').innerHTML =
            "<div style='color:red;text-align:center;padding:40px;'>❌ ไม่พบข้อมูลพัสดุนี้ในระบบ</div>";
          return;
        }
        currentItem  = data;
        selectedUnit = "";
        var mfgBoxHTML = '';
        if (data.sheetName === 'สายขนส่ง') {  // [CHANGE-ถ้าชื่อสายต่าง] สายที่ใช้ช่องวันที่ผลิต/เลขทะเบียนรถ
          var mfgTxt;
          if (data.mfgDate) {
            var mp = data.mfgDate.split('-');
            if (mp.length === 3) {
              mfgTxt = mp[2] + '/' + mp[1] + '/' + (parseInt(mp[0]) + 543);
            } else {
              mfgTxt = data.mfgDate;
            }
          } else {
            mfgTxt = '<span style="color:#aaa;font-size:13px;font-weight:400;">แตะเพื่อเพิ่ม</span>';
          }
          mfgBoxHTML = `
            <div class="mfg-box">
              <div class="label">📅 วันที่ผลิต</div>
              <div id="mfgDisplay" class="mfg-text"
                ondblclick="enableMfgEdit(this)"
                title="ดับเบิลคลิกเพื่อแก้ไข"
                style="cursor:pointer;min-height:24px;">
                ${mfgTxt}
              </div>
            </div>`;
        }
        var regNumBoxHTML = '';
        if (data.sheetName === 'สายขนส่ง') {  // [CHANGE-ถ้าชื่อสายต่าง] สายที่ใช้ช่องวันที่ผลิต/เลขทะเบียนรถ
          var regTxt = data.regNum
            ? data.regNum
            : '<span style="color:#aaa;font-size:13px;font-weight:400;">แตะเพื่อเพิ่ม</span>';
          regNumBoxHTML = `
            <div class="reg-box">
              <div class="label">🚗 เลขทะเบียนรถ</div>
              <div id="regDisplay" class="reg-text"
                ondblclick="enableRegEdit(this)"
                title="ดับเบิลคลิกเพื่อแก้ไข"
                style="cursor:pointer;min-height:24px;">
                ${regTxt}
              </div>
            </div>`;
        }

        document.getElementById('content').innerHTML = `
          <div class="item-info">
            <div class="label">หมายเลขพัสดุ (ID)</div>
            <div class="item-id">${data.id}</div>
            <div class="label">ชื่อพัสดุ</div>
            <div class="item-name">${data.name}</div>
            <div class="loc-container">
              <div class="loc-box">
                <div class="label">สายงาน/คลัง</div>
                <div class="loc-text">${data.sheetName}</div>
              </div>
              <div class="loc-box">
                <div class="label">ที่เก็บพัสดุ</div>
                <div id="locDisplay" class="loc-text"
                  ondblclick="enableLocEdit(this)"
                  title="ดับเบิลคลิกเพื่อแก้ไข"
                  style="cursor:pointer;min-height:24px;">
                  ${data.location && data.location !== '-'
                    ? data.location
                    : '<span style="color:#aaa;font-size:13px;font-weight:400;">แตะเพื่อเพิ่ม</span>'}
                </div>
              </div>
            </div>
            ${mfgBoxHTML}
            ${regNumBoxHTML}
          </div>

          <div class="qty-section">
            <div style="font-size:16px;color:#5f6368;font-weight:600;text-align:center;">ยอดคงเหลือปัจจุบัน</div>
            <div class="qty-control">
              <button class="btn-circle btn-minus" onclick="changeQty(-1)"><i class="fas fa-minus"></i></button>
              <input type="number" id="qtyInput" value="${data.qty}" class="qty-input">
              <button class="btn-circle btn-plus"  onclick="changeQty(1)"><i class="fas fa-plus"></i></button>
            </div>
            <div class="adjust-section">
              <div style="font-size:14px;color:#5f6368;font-weight:600;margin-bottom:5px;text-align:center;">ตัวช่วยคำนวณ จ่ายออก | รับเข้า</div>
              <div class="adjust-controls">
                <input type="number" id="adjustVal" class="adjust-input" placeholder="จำนวน" min="1">
                <button class="btn-adjust btn-deduct" onclick="quickAdjust(-1)"><i class="fas fa-minus"></i> จ่าย</button>
                <button class="btn-adjust btn-add"    onclick="quickAdjust(1)"><i class="fas fa-plus"></i>  รับ</button>
              </div>
            </div>
          </div>

          <div id="msg"></div>

          <button class="btn-save" onclick="saveAll()">
            <i class="fas fa-save"></i> บันทึกข้อมูล
          </button>

          <button class="btn-save" style="background-color:#5f6368;margin-top:10px;" onclick="runSummary()">
            <i class="fas fa-file-alt"></i> สรุปยอดวันนี้ลงชีท
          </button>

          <button class="btn-save" style="background:#e8f0fe;color:#1a73e8;margin-top:10px;box-shadow:none;border:1.5px solid #1a73e8;" onclick="loadDashboard()">
            <i class="fas fa-home"></i> กลับหน้าหลัก
          </button>`;
      }

      function enableMfgEdit(element) {
        var inputVal = (currentItem && currentItem.mfgDate) ? currentItem.mfgDate : '';
        var input = document.createElement('input');
        input.type  = 'date';
        input.value = inputVal;
        input.id    = 'mfgInput';
        input.style.cssText = 'width:100%;font-family:Kanit;font-size:15px;text-align:center;' +
          'border:1.5px solid var(--primary);border-radius:8px;padding:4px;box-sizing:border-box;color:#e65100;';
        input.onblur   = function() { saveMfgEdit(this); };
        input.onkeydown = function(e) { if (e.key === 'Enter') this.blur(); };
        element.innerHTML = '';
        element.appendChild(input);
        input.focus();
      }

      function saveMfgEdit(input) {
        var newVal  = input.value.trim(); 
        var display = document.getElementById('mfgDisplay');
        if (!display) return;
        if (newVal) {
          var parts = newVal.split('-');
          if (parts.length === 3) {
            display.innerText = parts[2] + '/' + parts[1] + '/' + (parseInt(parts[0]) + 543);
          } else {
            display.innerText = newVal;
          }
          currentItem.mfgDate = newVal;
        } else {
          display.innerHTML = '<span style="color:#aaa;font-size:13px;font-weight:400;">แตะเพื่อเพิ่ม</span>';
          currentItem.mfgDate = '';
        }
        var msg = document.getElementById('msg');
        if (msg) {
          msg.style.color = '#f9ab00';
          msg.innerHTML   = '⚠️ แก้ไขวันที่ผลิตแล้ว อย่าลืมกดบันทึกข้อมูล';
        }
      }

      function enableRegEdit(element) {
        var currentVal = (currentItem && currentItem.regNum) ? currentItem.regNum : '';
        var input = document.createElement('input');
        input.type        = 'text';
        input.value       = currentVal;
        input.id          = 'regInput';
        input.placeholder = 'เช่น กห 57506';
        input.style.cssText = 'width:100%;font-family:Kanit;font-size:15px;text-align:center;' +
          'border:1.5px solid #2e7d32;border-radius:8px;padding:4px;box-sizing:border-box;color:#2e7d32;';
        input.onblur    = function() { saveRegEdit(this); };
        input.onkeydown = function(e) { if (e.key === 'Enter') this.blur(); };
        element.innerHTML = '';
        element.appendChild(input);
        input.focus();
      }

      function saveRegEdit(input) {
        var newVal  = input.value.trim();
        var display = document.getElementById('regDisplay');
        if (!display) return;
        if (newVal) {
          display.innerText    = newVal;
          currentItem.regNum   = newVal;
        } else {
          display.innerHTML    = '<span style="color:#aaa;font-size:13px;font-weight:400;">แตะเพื่อเพิ่ม</span>';
          currentItem.regNum   = '';
        }
        var msg = document.getElementById('msg');
        if (msg) {
          msg.style.color = '#f9ab00';
          msg.innerHTML   = '⚠️ แก้ไขเลขทะเบียนรถแล้ว อย่าลืมกดบันทึกข้อมูล';
        }
      }

      function changeQty(amount) {
        var input = document.getElementById('qtyInput');
        var val = Number(input.value) + amount;
        if (val < 0) val = 0;
        input.value = val;
        var diff = currentItem.qty - val;
        var msg  = document.getElementById('msg');
        msg.style.color = "#f9ab00";
        if (diff > 0) {
          var displayUnit = (selectedUnit && selectedUnit.length > 3) ? selectedUnit.substring(3) : selectedUnit;
          var unitTxt = selectedUnit ? `ให้: <b>${displayUnit}</b> ` : "";
          msg.innerHTML = `⚠️ เตรียมจ่าย${unitTxt}จำนวน <b>${diff}</b> รายการ (กดบันทึกเพื่อยืนยัน)`;
        } else if (diff < 0) {
          msg.innerHTML = `⚠️ เตรียมรับเข้าคลัง จำนวน <b>${Math.abs(diff)}</b> รายการ (กดบันทึกเพื่อยืนยัน)`;
        } else {
          msg.innerHTML = "";
        }
      }

      function quickAdjust(multiplier) {
        var adjustInput = document.getElementById('adjustVal');
        var val = parseInt(adjustInput.value);
        if (!val || val <= 0) { showError("กรุณาระบุจำนวน"); return; }
        if (multiplier === -1) {
          var unitList = units.map(function(u) {
            return `<button onclick="confirmAdjust(${val}, -1, '${u}')" class="unit-btn">${u}</button>`;
          }).join('');
          var overlay = document.createElement('div');
          overlay.id = 'unitOverlay';
          overlay.innerHTML = `
            <div class="unit-modal">
              <h4 style="margin-top:0;">จ่ายพัสดุให้หน่วยงานไหน?</h4>
              <div class="unit-grid">${unitList}</div>
              <button onclick="document.getElementById('unitOverlay').remove()"
                style="margin-top:15px;background:#5f6368;color:white;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-family:Kanit;">
                ยกเลิก
              </button>
            </div>`;
          document.body.appendChild(overlay);
        } else {
          confirmAdjust(val, 1, "รับเข้าคลัง");
        }
      }

      function confirmAdjust(val, multiplier, unit) {
        var mainInput  = document.getElementById('qtyInput');
        var newTotal   = (parseInt(mainInput.value) || 0) + (val * multiplier);
        if (newTotal < 0) newTotal = 0;
        mainInput.value = newTotal;
        selectedUnit    = unit;
        document.getElementById('adjustVal').value = "";
        if (document.getElementById('unitOverlay')) document.getElementById('unitOverlay').remove();
        var diff = currentItem.qty - newTotal;
        var msg  = document.getElementById('msg');
        msg.style.color = "#f9ab00";
        if (multiplier === -1) {
          var displayUnit = (unit.length > 3) ? unit.substring(3) : unit;
          msg.innerHTML = `⚠️ เตรียมจ่ายให้: <b>${displayUnit}</b> จำนวน <b>${diff}</b> รายการ (กดบันทึกเพื่อยืนยัน)`;
        } else {
          msg.innerHTML = `⚠️ เตรียมรับเข้าคลัง จำนวน <b>${Math.abs(diff)}</b> รายการ (กดบันทึกเพื่อยืนยัน)`;
        }
      }

      function saveAll() {
        if (!currentItem) return;
        var newQty = document.getElementById('qtyInput').value;
        var diff   = currentItem.qty - newQty;
        if (diff > 0 && (!selectedUnit || selectedUnit === "รับเข้าคลัง")) {
          openUnitModalForSave(diff);
          return;
        }
        var msg = document.getElementById('msg');
        msg.style.color = "#1a73e8";
        msg.innerHTML   = "<i class='fas fa-spinner fa-spin'></i> กำลังบันทึกข้อมูล...";
        var mfgDateToSave = (currentItem.sheetName === 'สายขนส่ง')  // [CHANGE-ถ้าชื่อสายต่าง] สายที่ใช้ช่องวันที่ผลิต/เลขทะเบียนรถ
          ? (currentItem.mfgDate !== undefined ? currentItem.mfgDate : '')
          : null;
        var regNumToSave = (currentItem.sheetName === 'สายขนส่ง')  // [CHANGE-ถ้าชื่อสายต่าง] สายที่ใช้ช่องวันที่ผลิต/เลขทะเบียนรถ
          ? (currentItem.regNum !== undefined ? currentItem.regNum : '')
          : null;
        google.script.run.withSuccessHandler(function(res) {
          if (res.toString().indexOf("Error") > -1) {
            msg.style.color = "#d93025";
            msg.innerText   = "❌ " + res;
          } else {
            currentItem.qty = res;
            msg.style.color = "#28a745";
            msg.innerHTML   = "<i class='fas fa-check-circle'></i> บันทึกสำเร็จ!";
            selectedUnit    = "";
            setTimeout(function() { msg.innerText = ""; }, 3500);
          }
        }).updateQty(
          currentItem.sheetName,
          currentItem.row,
          newQty,
          currentItem.name,
          selectedUnit,
          currentItem.location,
          mfgDateToSave,
          regNumToSave    
        );
      }

      function openUnitModalForSave(diff) {
        var unitList = units.map(function(u) {
          return `<button onclick="selectUnitForSave('${u}', ${diff})" class="unit-btn">${u}</button>`;
        }).join('');
        var overlay = document.createElement('div');
        overlay.id  = 'unitOverlay';
        overlay.innerHTML = `
          <div class="unit-modal">
            <h4 style="margin-top:0;color:#d93025;">จ่ายพัสดุจำนวน ${diff} รายการ ให้หน่วยไหน?</h4>
            <div class="unit-grid">${unitList}</div>
            <button onclick="document.getElementById('unitOverlay').remove()"
              style="margin-top:15px;background:#5f6368;color:white;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-family:Kanit;">
              ยกเลิก
            </button>
          </div>`;
        document.body.appendChild(overlay);
      }

      function selectUnitForSave(unit, diff) {
        selectedUnit = unit;
        if (document.getElementById('unitOverlay')) document.getElementById('unitOverlay').remove();
        var displayUnit = (unit.length > 3) ? unit.substring(3) : unit;
        var msg = document.getElementById('msg');
        msg.style.color = "#f9ab00";
        msg.innerHTML   = `⚠️ เตรียมจ่ายให้: <b>${displayUnit}</b> จำนวน <b>${diff}</b> รายการ (กดบันทึกเพื่อยืนยัน)`;
        showPopup("เลือกหน่วย " + displayUnit + " แล้ว กรุณากดปุ่มบันทึกอีกครั้ง");
      }

      function showError(message) {
        var popup = document.createElement("div");
        popup.className = "popup-error";
        popup.innerHTML = "⚠️ " + message;
        document.body.appendChild(popup);
        setTimeout(function() { popup.remove(); }, 2500);
      }

      function showPopup(m) {
        var p = document.createElement("div");
        p.className = "popup-success";
        p.innerHTML = "✅ " + m;
        document.body.appendChild(p);
        setTimeout(function() { p.remove(); }, 2500);
      }

      function runSummary() {
        var msg = document.getElementById('msg');
        msg.style.color = "#1a73e8";
        msg.innerHTML   = "<i class='fas fa-spinner fa-spin'></i> กำลังสรุปยอด...";
        google.script.run.withSuccessHandler(function(res) {
          msg.innerHTML = "";
          showPopup(res);
        }).generateDailySummary();
      }

      var searchTimeout;
      function handleSearch(val) {
        clearTimeout(searchTimeout);
        var resultsDiv = document.getElementById('searchResults');
        if (val.length < 2) { resultsDiv.style.display = 'none'; return; }
        searchTimeout = setTimeout(function() {
          google.script.run.withSuccessHandler(displayResults).searchParcelByName(val);
        }, 300);
      }

      function displayResults(results) {
        var resultsDiv = document.getElementById('searchResults');
        if (results.length === 0) {
          resultsDiv.innerHTML = '<div class="result-item" style="text-align:center;color:#d93025;">ไม่พบข้อมูล</div>';
        } else {
          resultsDiv.innerHTML = results.map(function(item) {
            return `
              <div class="result-item" onclick="selectItem('${item.id}')"
                style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                  <span class="res-name">${item.name}</span>
                  <span class="res-sub">ID: ${item.id} | คลัง: ${item.sheetName}</span>
                </div>
                <div style="background:#e8f0fe;padding:6px 12px;border-radius:8px;text-align:center;">
                  <div style="font-size:18px;font-weight:700;color:#1a73e8;">${item.qty}</div>
                  <div style="font-size:11px;color:#1a73e8;">คงเหลือ</div>
                </div>
              </div>`;
          }).join('');
        }
        resultsDiv.style.display = 'block';
      }

      function selectItem(id) {
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('searchInput').value = '';
        document.getElementById('content').innerHTML = `
          <div class="loading">
            <i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i> กำลังเรียกดูข้อมูลพัสดุ...
          </div>`;
        google.script.run.withSuccessHandler(showData).getItemData(id);
      }

      window.onload = function() {
      var itemId = (typeof LOADED_ITEM_ID === 'string' ? LOADED_ITEM_ID : '').trim();
      console.log("itemId:", itemId);
      if (itemId && itemId.length > 2) {
      selectItem(itemId);
      } else {
      loadDashboard();
      }
      };

      document.addEventListener('click', function(e) {
        var si = document.getElementById('searchInput');
        var sb = document.querySelector('.scan-btn-inline');
        if (!si.contains(e.target) && !sb.contains(e.target)) {
          document.getElementById('searchResults').style.display = 'none';
        }
      });

      function enableLocEdit(element) {

        var wrap = document.getElementById('mfgDateWrap');

          wrap.style.display = (val === 'สายขนส่ง') ? 'block' : 'none';  // [CHANGE-ถ้าชื่อสายต่าง] สายที่ใช้ช่องวันที่ผลิต/เลขทะเบียนรถ
          var mfgInput = document.getElementById('newItemMfgDate');
          if (mfgInput) mfgInput.value = '';
        }
        var regWrap = document.getElementById('regNumWrap');
        if (regWrap) {
          regWrap.style.display = (val === 'สายขนส่ง') ? 'block' : 'none';  // [CHANGE-ถ้าชื่อสายต่าง] สายที่ใช้ช่องวันที่ผลิต/เลขทะเบียนรถ
          var regInput = document.getElementById('newItemRegNum');
          if (regInput) regInput.value = '';
        }
      }

      function saveNewItem() {
        var id       = document.getElementById('newItemId').value.trim();
        var name     = document.getElementById('newItemName').value.trim();
        var sheet    = document.getElementById('newItemSheet').value;
        var location = document.getElementById('newItemLocation').value.trim() || "-";
        var unit     = document.getElementById('newItemUnit').value.trim();
        var qty      = parseInt(document.getElementById('newItemQty').value) || 0;
        var msg      = document.getElementById('msg');
        var mfgDate = '';
        var regNum  = '';  
        if (sheet === 'สายขนส่ง') {  // [CHANGE-ถ้าชื่อสายต่าง] สายที่ใช้ช่องวันที่ผลิต/เลขทะเบียนรถ
          var mfgInput = document.getElementById('newItemMfgDate');
          if (mfgInput) mfgDate = mfgInput.value || '';
          var regInput = document.getElementById('newItemRegNum');
          if (regInput) regNum = regInput.value.trim() || '';
        }

        if (!id || !name || qty <= 0) {
          showError("กรุณากรอกหมายเลข, ชื่อพัสดุ และจำนวนให้ครบ");
          return;
        }

        msg.style.color = "#1a73e8";
        msg.innerHTML   = "<i class='fas fa-spinner fa-spin'></i> กำลังบันทึก...";

        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.toString().indexOf("Error") > -1) {
              msg.style.color = "#d93025";
              msg.innerHTML   = "❌ " + res;
            } else {
              showPopup("เพิ่มพัสดุ \"" + name + "\" เข้าคลังเรียบร้อย!");
              resetToSearch();
            }
          })
          .withFailureHandler(function(err) {
            msg.style.color = "#d93025";
            msg.innerHTML   = "❌ เกิดข้อผิดพลาด: " + err.message;
          })
          .addNewItem(sheet, id, name, location, qty, mfgDate, regNum, unit); 
      }

      function closeDrillDown() {
        var el = document.getElementById('ddOverlay');
        if (el) el.remove();

      function createDDOverlay(titleHTML, headerExtra, bodyHTML) {
        closeDrillDown();
        var overlay = document.createElement('div');
        overlay.className = 'dd-overlay';
        overlay.id = 'ddOverlay';
        overlay.onclick = function(e) { if (e.target === overlay) closeDrillDown(); };
        overlay.innerHTML = `
          <div class="dd-sheet">
            <div class="dd-handle"></div>
            <div class="dd-header">
              <div class="dd-title">${titleHTML}</div>
              ${headerExtra}
            </div>
            <div class="dd-body" id="ddBody">${bodyHTML}</div>
          </div>`;
        document.body.appendChild(overlay);
      }

      function openTotalItems() {
        var tabs = `
          <div class="dd-tabs">
            <!-- [CHANGE-ถ้าสายต่างจากต้นแบบ] แท็บสายงานหน้า "พัสดุทั้งหมด" (id ต้องเป็น tab-<ชื่อชีท>) -->
            <button class="dd-tab active" id="tab-all"         onclick="switchTotalTab('all')">ทั้งหมด</button>
            <button class="dd-tab"        id="tab-สายพลา"      onclick="switchTotalTab('สายพลา')">สายพลา</button>
            <button class="dd-tab"        id="tab-สายสื่อสาร"  onclick="switchTotalTab('สายสื่อสาร')">สายสื่อสาร</button>
            <button class="dd-tab"        id="tab-สายช่างโยธา"  onclick="switchTotalTab('สายช่างโยธา')">สายช่างโยธา</button>
            <button class="dd-tab"        id="tab-สายขนส่ง"    onclick="switchTotalTab('สายขนส่ง')">สายขนส่ง</button>
          </div>
          <input class="dd-search" id="ddTotalSearch" placeholder="🔍 ค้นหาชื่อหรือหมายเลข..." oninput="filterTotalList(this.value)">`;
        createDDOverlay('📦 รายการพัสดุทั้งหมด', tabs, '<div class="dd-empty"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>');
        window._ddTotalAll   = [];
        window._ddTotalSheet = 'all';
        google.script.run.withSuccessHandler(function(items) {
          window._ddTotalAll = items;
          renderTotalList(items);
        }).getTotalItemsList('');
      }

      function switchTotalTab(sheet) {
        window._ddTotalSheet = sheet;
        document.querySelectorAll('.dd-tab').forEach(function(t) { t.classList.remove('active'); });
        document.getElementById('tab-' + sheet).classList.add('active');
        document.getElementById('ddTotalSearch').value = '';
        var filtered = sheet === 'all' ? window._ddTotalAll : window._ddTotalAll.filter(function(i) { return i.sheetName === sheet; });
        renderTotalList(filtered);
      }

      function filterTotalList(q) {
        var sheet = window._ddTotalSheet;
        var base  = sheet === 'all' ? window._ddTotalAll : window._ddTotalAll.filter(function(i) { return i.sheetName === sheet; });
        if (!q) { renderTotalList(base); return; }
        var lq = q.toLowerCase();
        renderTotalList(base.filter(function(i) {
          return i.name.toLowerCase().indexOf(lq) > -1 || i.id.toLowerCase().indexOf(lq) > -1;
        }));
      }

      function renderTotalList(items) {
        var body = document.getElementById('ddBody');
        if (!body) return;
        if (!items || items.length === 0) { body.innerHTML = '<div class="dd-empty">ไม่พบรายการ</div>'; return; }
        var count = `<div class="dd-count">แสดง ${items.length} รายการ</div>`;
        var html = items.map(function(item) {
          var qtyClass = item.qty === 0 ? 'dd-badge-zero' : (item.qty <= 5 ? 'dd-badge-orange' : 'dd-badge-blue');
          var qtyLabel = item.qty === 0 ? 'หมด!' : item.qty;
          return `
            <div class="dd-row" onclick="closeDrillDown();selectItem('${item.id}')">
              <div class="dd-row-info">
                <div class="dd-row-name">${item.name}</div>
                <div class="dd-row-sub">ID: ${item.id} | ${item.sheetName} | ที่เก็บ: ${item.location}</div>
              </div>
              <span class="dd-badge ${qtyClass}">${qtyLabel}</span>
            </div>`;
        }).join('');
        body.innerHTML = count + html;
      }

      function openLowStock() {
        var tabs = `
          <div class="dd-tabs">
            <!-- [CHANGE-ถ้าสายต่างจากต้นแบบ] แท็บสายงานหน้า "พัสดุใกล้หมด" (id ต้องเป็น ls-tab-<ชื่อชีท>) -->
            <button class="dd-tab active" id="ls-tab-all"         onclick="switchLSTab('all')">ทั้งหมด</button>
            <button class="dd-tab"        id="ls-tab-สายพลา"      onclick="switchLSTab('สายพลา')">สายพลา</button>
            <button class="dd-tab"        id="ls-tab-สายสื่อสาร"  onclick="switchLSTab('สายสื่อสาร')">สายสื่อสาร</button>
            <button class="dd-tab"        id="ls-tab-สายช่างโยธา"      onclick="switchLSTab('สายช่างโยธา')">สายช่างโยธา</button>
            <button class="dd-tab"        id="ls-tab-สายขนส่ง"    onclick="switchLSTab('สายขนส่ง')">สายขนส่ง</button>
            <button class="dd-tab"        id="ls-tab-zero"         onclick="switchLSTab('zero')">หมดแล้ว</button>
          </div>`;
        createDDOverlay('⚠️ รายการพัสดุใกล้หมด', tabs, '<div class="dd-empty"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>');
        window._ddLSAll = [];
        google.script.run.withSuccessHandler(function(d) {
          window._ddLSAll = d.lowStockItems || [];
          renderLSList(window._ddLSAll);
        }).getDashboardData();
      }

      function switchLSTab(sheet) {
        document.querySelectorAll('.dd-tab').forEach(function(t) { t.classList.remove('active'); });
        document.getElementById('ls-tab-' + sheet).classList.add('active');
        var base     = window._ddLSAll;
        var filtered = sheet === 'all'  ? base
          : sheet === 'zero'            ? base.filter(function(i) { return i.qty === 0; })
          : base.filter(function(i) { return i.sheetName === sheet; });
        renderLSList(filtered);
      }

      function renderLSList(items) {
        var body = document.getElementById('ddBody');
        if (!body) return;
        if (!items || items.length === 0) {
          body.innerHTML = '<div class="dd-empty" style="color:#34a853;"><i class="fas fa-check-circle"></i> ไม่มีพัสดุใกล้หมด</div>';
          return;
        }
        var count = `<div class="dd-count">แสดง ${items.length} รายการ</div>`;
        var html = items.map(function(item) {
          var cls   = item.qty === 0 ? 'dd-badge-zero' : 'dd-badge-orange';
          var label = item.qty === 0 ? 'หมด!' : item.qty;
          return `
            <div class="dd-row" onclick="closeDrillDown();selectItem('${item.id}')">
              <div class="dd-row-info">
                <div class="dd-row-name">${item.name}</div>
                <div class="dd-row-sub">ID: ${item.id} | ${item.sheetName}</div>
              </div>
              <span class="dd-badge ${cls}">${label}</span>
            </div>`;
        }).join('');
        body.innerHTML = count + html;
      }

      function openHistoryDrillDown(type) {
        var icon  = type === 'รับเข้า' ? '📥' : '📤';
        var color = type === 'รับเข้า' ? '#1e8e3e' : '#d93025';
        var now   = new Date();
        window._ddHistDate  = { y: now.getFullYear(), m: now.getMonth(), d: now.getDate() };
        window._ddHistType  = type;
        window._calDotCache = {};
        var dateBar = `
          <div class="dd-date-bar" style="justify-content:center;gap:6px;">
            <button onclick="shiftHistDate(-1)"
              style="padding:8px 16px;font-size:20px;background:#f1f3f4;color:#202124;
              border:none;border-radius:10px;cursor:pointer;flex-shrink:0;">‹</button>
            <div id="ddDateLabel" onclick="openMiniCal(event)"
              style="flex:1;text-align:center;font-size:15px;font-weight:600;
              color:#1a73e8;background:#e8f0fe;border-radius:10px;padding:10px 8px;
              cursor:pointer;user-select:none;"></div>
            <button id="ddNextBtn" onclick="shiftHistDate(1)"
              style="padding:8px 16px;font-size:20px;background:#f1f3f4;color:#202124;
              border:none;border-radius:10px;cursor:pointer;flex-shrink:0;">›</button>
          </div>`;
        createDDOverlay(
          `<span style="color:${color}">${icon} ${type === 'รับเข้า' ? 'รับเข้า' : 'จ่ายออก'}</span>`,
          dateBar,
          '<div class="dd-empty"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>'
        );
        updateDateLabel();
        loadCalDots(now.getFullYear(), now.getMonth(), function() { loadHistDrillDown(); });
      }

      function loadCalDots(y, m, callback) {
        var key = y + '-' + m;
        if (window._calDotCache && window._calDotCache[key] !== undefined) {
          if (callback) callback();
          return;
        }
        google.script.run.withSuccessHandler(function(days) {
          if (!window._calDotCache) window._calDotCache = {};
          window._calDotCache[key] = days || [];
          if (callback) callback();
        }).getMonthActivity(y, m, window._ddHistType);
      }

      function openMiniCal(event) {
        event.stopPropagation();
        if (document.getElementById('miniCalOverlay')) { closeMiniCal(); return; }
        var h = window._ddHistDate;
        window._calView = { y: h.y, m: h.m };
        loadCalDots(h.y, h.m, function() {
          var overlay = document.createElement('div');
          overlay.id = 'miniCalOverlay';
          overlay.style.cssText = 'position:fixed;inset:0;z-index:30000;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;';
          overlay.onclick = function(e) { if (e.target === overlay) closeMiniCal(); };
          var cal = document.createElement('div');
          cal.id = 'miniCal';
          cal.style.cssText = 'background:white;border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,0.25);padding:20px;width:320px;animation:slideUp 0.2s ease;';
          cal.onclick = function(e) { e.stopPropagation(); };
          cal.innerHTML = buildCalHTML(h.y, h.m, h);
          overlay.appendChild(cal);
          document.body.appendChild(overlay);
        });
      }

      function closeMiniCal() {
        var el = document.getElementById('miniCalOverlay');
        if (el) el.remove();
      }

      function buildCalHTML(y, m, selected) {
        var thMonths = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                        'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
        var today       = new Date();
        var todayY      = today.getFullYear();
        var todayM      = today.getMonth();
        var todayD      = today.getDate();
        var firstDay    = new Date(y, m, 1).getDay();
        var daysInMonth = new Date(y, m + 1, 0).getDate();
        var minY = 2020; var maxY = todayY;
        var isMaxMonth = (y === todayY && m === todayM);
        var isMinMonth = (y === minY && m === 0);
        var yearOpts = '';
        for (var yr = minY; yr <= maxY; yr++) {
          yearOpts += `<option value="${yr}" ${yr === y ? 'selected' : ''}>${yr + 543}</option>`;
        }
        var monthOpts = '';
        for (var mi = 0; mi < 12; mi++) {
          var disabled = (y === todayY && mi > todayM) ? 'disabled' : '';
          monthOpts += `<option value="${mi}" ${mi === m ? 'selected' : ''} ${disabled}>${thMonths[mi]}</option>`;
        }
        var header = `
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:14px;">
            <button onclick="shiftCalMonth(-1)" ${isMinMonth ? 'disabled' : ''}
              style="background:#f1f3f4;border:none;width:36px;height:36px;border-radius:10px;
              font-size:18px;cursor:pointer;color:${isMinMonth ? '#ccc' : '#202124'};flex-shrink:0;">‹</button>
            <select onchange="jumpCalMonth(this.value)"
              style="flex:1;padding:6px 4px;border:1.5px solid #e0e0e0;border-radius:10px;
              font-family:'Kanit';font-size:13px;text-align:center;background:white;color:#202124;">
              ${monthOpts}
            </select>
            <select onchange="jumpCalYear(this.value)"
              style="width:90px;padding:6px 4px;border:1.5px solid #e0e0e0;border-radius:10px;
              font-family:'Kanit';font-size:13px;text-align:center;background:white;color:#202124;">
              ${yearOpts}
            </select>
            <button onclick="shiftCalMonth(1)" ${isMaxMonth ? 'disabled' : ''}
              style="background:#f1f3f4;border:none;width:36px;height:36px;border-radius:10px;
              font-size:18px;cursor:pointer;color:${isMaxMonth ? '#ccc' : '#202124'};flex-shrink:0;">›</button>
          </div>`;
        var dayHeaders = ['อา','จ','อ','พ','พฤ','ศ','ส'].map(function(dn) {
          return `<div style="text-align:center;font-size:12px;color:#9aa0a6;font-weight:600;padding:6px 0;">${dn}</div>`;
        }).join('');
        var cacheKey   = y + '-' + m;
        var activeDays = (window._calDotCache && window._calDotCache[cacheKey]) ? window._calDotCache[cacheKey] : [];
        var activeSet  = {};
        activeDays.forEach(function(d) { activeSet[d] = true; });
        var dotColor = (window._ddHistType === 'รับเข้า') ? '#1e8e3e' : '#d93025';
        var cells = '';
        for (var i = 0; i < firstDay; i++) cells += '<div></div>';
        for (var day = 1; day <= daysInMonth; day++) {
          var isSel    = (selected && y === selected.y && m === selected.m && day === selected.d);
          var isTd     = (y === todayY && m === todayM && day === todayD);
          var isFuture = (y > todayY) || (y === todayY && m > todayM) || (y === todayY && m === todayM && day > todayD);
          var bg   = isSel ? '#1a73e8' : (isTd ? '#e8f0fe' : 'transparent');
          var clr  = isSel ? 'white'   : (isTd ? '#1a73e8' : (isFuture ? '#d0d0d0' : '#202124'));
          var fw   = (isSel || isTd) ? '700' : '400';
          var click = isFuture ? '' : `onclick="pickCalDay(${day})"`;
          var cur   = isFuture ? 'default' : 'pointer';
          var dotHTML = '';
          if (activeSet[day] && !isFuture) {
            var dotBg = isSel ? 'white' : dotColor;
            dotHTML = `<span style="width:6px;height:6px;border-radius:50%;background:${dotBg};position:absolute;top:2px;right:3px;display:block;"></span>`;
          }
          cells += `<div ${click} style="text-align:center;padding:8px 2px;border-radius:10px;font-size:14px;background:${bg};color:${clr};font-weight:${fw};cursor:${cur};transition:0.1s;position:relative;">${day}${dotHTML}</div>`;
        }
        return header + `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">${dayHeaders}${cells}</div>
          <button onclick="closeMiniCal()" style="width:100%;margin-top:16px;padding:10px;border:none;border-radius:12px;background:#f1f3f4;color:#5f6368;font-family:'Kanit';font-size:14px;cursor:pointer;">ปิด</button>`;
      }

      function jumpCalMonth(val) {
        window._calView.m = parseInt(val);
        var today = new Date();
        if (window._calView.y === today.getFullYear() && window._calView.m > today.getMonth()) window._calView.m = today.getMonth();
        loadCalDots(window._calView.y, window._calView.m, function() {
          var cal = document.getElementById('miniCal');
          if (cal) cal.innerHTML = buildCalHTML(window._calView.y, window._calView.m, window._ddHistDate);
        });
      }

      function jumpCalYear(val) {
        window._calView.y = parseInt(val);
        var today = new Date();
        if (window._calView.y === today.getFullYear() && window._calView.m > today.getMonth()) window._calView.m = today.getMonth();
        loadCalDots(window._calView.y, window._calView.m, function() {
          var cal = document.getElementById('miniCal');
          if (cal) cal.innerHTML = buildCalHTML(window._calView.y, window._calView.m, window._ddHistDate);
        });
      }

      function shiftCalMonth(delta) {
        var d = new Date(window._calView.y, window._calView.m + delta, 1);
        window._calView = { y: d.getFullYear(), m: d.getMonth() };
        loadCalDots(d.getFullYear(), d.getMonth(), function() {
          var cal = document.getElementById('miniCal');
          if (cal) cal.innerHTML = buildCalHTML(d.getFullYear(), d.getMonth(), window._ddHistDate);
        });
      }

      function pickCalDay(day) {
        window._ddHistDate = { y: window._calView.y, m: window._calView.m, d: day };
        closeMiniCal();
        updateDateLabel();
        loadHistDrillDown();
      }

      function toThaiDateStr(y, m, d) {
        var mm = String(m + 1).padStart(2, '0');
        var dd = String(d).padStart(2, '0');
        return dd + '/' + mm + '/' + (y + 543);
      }

      function shiftHistDate(delta) {
        var h   = window._ddHistDate;
        var cur = new Date(h.y, h.m, h.d);
        cur.setDate(cur.getDate() + delta);
        var today = new Date(); today.setHours(0,0,0,0);
        if (cur > today) return;
        var newH = { y: cur.getFullYear(), m: cur.getMonth(), d: cur.getDate() };
        window._ddHistDate = newH;
        if (newH.y !== h.y || newH.m !== h.m) loadCalDots(newH.y, newH.m, null);
        closeMiniCal();
        updateDateLabel();
        loadHistDrillDown();
      }

      function updateDateLabel() {
        var h       = window._ddHistDate;
        var label   = document.getElementById('ddDateLabel');
        var nextBtn = document.getElementById('ddNextBtn');
        if (!label) return;
        var today   = new Date();
        var isToday = (h.y === today.getFullYear() && h.m === today.getMonth() && h.d === today.getDate());
        label.textContent = '📅 ' + toThaiDateStr(h.y, h.m, h.d);
        if (nextBtn) nextBtn.style.opacity = isToday ? '0.3' : '1';
      }

      function loadHistDrillDown() {
        var h       = window._ddHistDate;
        var mm      = String(h.m + 1).padStart(2, '0');
        var dd      = String(h.d).padStart(2, '0');
        var dateStr = h.y + '-' + mm + '-' + dd;
        var body    = document.getElementById('ddBody');
        if (!body) return;
        body.innerHTML = '<div class="dd-empty"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>';
        google.script.run.withSuccessHandler(function(rows) {
          renderHistDrillDown(rows, dateStr);
        }).getHistoryByDate(dateStr, window._ddHistType);
      }

      function renderHistDrillDown(rows, dateStr) {
        var body      = document.getElementById('ddBody');
        if (!body) return;
        var h         = window._ddHistDate;
        var dateLabel = toThaiDateStr(h.y, h.m, h.d);
        var isReceive = window._ddHistType === 'รับเข้า';
        if (!rows || rows.length === 0) {
          body.innerHTML = `<div class="dd-empty">ไม่มีรายการ${isReceive ? 'รับเข้า' : 'จ่ายออก'}<br>วันที่ ${dateLabel}</div>`;
          return;
        }
        var count = `<div class="dd-count">วันที่ ${dateLabel} — ${rows.length} รายการ</div>`;
        var html  = rows.map(function(r) {
          var timeStr  = isReceive ? r.dateIn : r.dateOut;
          var badgeCls = isReceive ? 'dd-badge-green' : 'dd-badge-red';
          var unitTxt  = r.unit ? `<span style="color:#1a73e8;">→ ${r.unit}</span>` : '';
          return `
            <div class="dd-hist-row">
              <div class="dd-hist-top">
                <span class="dd-hist-name">${r.name}</span>
                <span class="dd-badge ${badgeCls}">${isReceive ? '+' : '-'}${r.amount}</span>
              </div>
              <div class="dd-hist-sub">
                ${r.id ? `ID: ${r.id} &nbsp;|&nbsp; ` : ''}${timeStr} ${unitTxt} &nbsp;|&nbsp; คงเหลือ: <b>${r.balance}</b>
              </div>
            </div>`;
        }).join('');
        body.innerHTML = count + html;
      }
